[project]
name = "command-loopy"
version = "0.0.0"
description = "A library for building command-line applications"
authors = [
    { name="Michael Frayer", email="frayerm@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
