[project]
name = "command-loopy"
version = "0.0.0"
description = "A library for building command-line applications"
authors = [
    { name="Michael Frayer", email="frayerm@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["command_loopy"]

[tool.pyright]
include = ["command_loopy"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
